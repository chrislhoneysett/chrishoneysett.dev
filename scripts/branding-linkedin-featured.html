<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chris Honeysett — LinkedIn featured link</title>
<style>
  @import url('../src/app/theme.css');
  @import url('../src/app/fonts.css');
  * { box-sizing: border-box; }
  body { margin: 0; }
  .thumbnail { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #e8e9df; color: #173037; }
  .identity { position: absolute; inset: 0 60px; display: grid; grid-template-columns: 30% minmax(0, 1fr); align-items: center; gap: 5%; }
  .mark { display: block; width: 100%; height: auto; }
  .copy { width: max-content; max-width: 100%; }
  h1 { margin: 0; font: 400 144px/.95 var(--font-family-display); letter-spacing: -.055em; }
  h1 span { display: block; }
  h1 span:last-child { color: #9c5b19; }
  .role { margin: 12px 0 0; color: #52656a; text-align: right; font: 400 44px/1.25 var(--font-family-body); }
  .role span { display: block; }
</style>
<main class="thumbnail">
  <div class="identity">
  <img class="mark" src="../src/app/icon.svg" alt="Chris Honeysett H mark">
  <div class="copy">
    <h1><span>Chris</span><span>Honeysett</span></h1>
    <p class="role"><span>Frontend &amp; Mobile</span><span>Engineering</span></p>
  </div>
  </div>
</main>
</html>
