<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chris Honeysett — LinkedIn banner</title>
<style>
  @import url('../src/app/theme.css');
  @import url('../src/app/fonts.css');
  * { box-sizing: border-box; }
  body { margin: 0; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; background: #e8e9df; color: #173037; }
  /* Keep the identity to the right of LinkedIn's overlapping profile photo. */
  .mark { position: absolute; top: 70px; left: 520px; width: 256px; height: 256px; }
  .copy { position: absolute; left: 832px; top: 42px; }
  h1 { margin: 0; font: normal 116px/.98 var(--font-family-display); letter-spacing: var(--tracking-display); }
  h1 span { display: block; }
  h1 span:last-child { padding-left: 0; color: #9c5b19; }
  .role { margin: 18px 0 0; color: #52656a; font: 28px/1.2 var(--font-family-body); }
  .url { margin: 12px 0 0; color: #173037; font: 24px/1.2 var(--font-family-code); }
</style>
<main class="banner">
  <img class="mark" src="../src/app/icon.svg" alt="Chris Honeysett mark">
  <div class="copy">
    <h1><span>Chris</span><span>Honeysett</span></h1>
    <p class="role">Frontend &amp; Mobile Engineer</p>
    <p class="url">chrishoneysett.dev</p>
  </div>
</main>
</html>
